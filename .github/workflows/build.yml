# Builds the .streamDeckPlugin file on every push and pull request.
# Pushing a tag like v2.1.0, or running the workflow by hand with a release tag, also creates a draft GitHub release with the file.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a draft release with this tag (e.g. v2.1.0), leave empty for a plain build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtwebsockets
          tools: tools_mingw1310
          cache: true

      - name: Build and package
        shell: pwsh
        run: .\tools\build-windows.ps1 -QtDir "$env:QT_ROOT_DIR" -MinGWDir "$env:IQTA_TOOLS\mingw1310_64"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: com.n3ckarmann.volumemixer.streamDeckPlugin (Windows)
          path: release/com.n3ckarmann.volumemixer.streamDeckPlugin
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtwebsockets
          cache: true

      - name: Install Ninja
        run: brew install ninja

      - name: Build and package
        run: ./tools/build-macos.sh "$QT_ROOT_DIR"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: com.n3ckarmann.volumemixer.streamDeckPlugin (macOS)
          path: release/com.n3ckarmann.volumemixer.streamDeckPlugin
          if-no-files-found: error

  # One .streamDeckPlugin for both systems: Stream Deck picks CodePathWin or CodePathMac
  package:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: parts

      - name: Combine
        run: |
          mkdir combined
          for f in parts/*/com.n3ckarmann.volumemixer.streamDeckPlugin; do unzip -qo "$f" -d combined; done
          test -f combined/com.n3ckarmann.volumemixer.sdPlugin/bin/streamdeck-volumemixer.exe
          test -f combined/com.n3ckarmann.volumemixer.sdPlugin/bin/streamdeck-volumemixer.app/Contents/MacOS/streamdeck-volumemixer
          # Stream Deck for Windows aborts the install on symlink entries
          if [ -n "$(find combined -type l)" ]; then find combined -type l; exit 1; fi
          mkdir release
          (cd combined && zip -qr ../release/com.n3ckarmann.volumemixer.streamDeckPlugin com.n3ckarmann.volumemixer.sdPlugin)

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: com.n3ckarmann.volumemixer.streamDeckPlugin (Windows + macOS)
          path: release/com.n3ckarmann.volumemixer.streamDeckPlugin
          if-no-files-found: error

      # The release action keeps an existing draft as it is (old text, old commit), so replace earlier drafts of this tag
      - name: Remove earlier draft of this release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id"; done

      # A manual re-run of an existing release moves its tag to the commit that was just built
      - name: Point existing tag to this build
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" -f sha="${{ github.sha }}" -F force=true
          fi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ inputs.release_tag && github.ref_name || github.sha }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: release/com.n3ckarmann.volumemixer.streamDeckPlugin
          draft: true
