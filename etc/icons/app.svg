<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8bfa"/>
      <stop offset="0.45" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#3f4ad6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6fb"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d45"/>
      <stop offset="1" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9f6d0"/>
      <stop offset="0.5" stop-color="#43d17f"/>
      <stop offset="1" stop-color="#1f9d58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b0e3a" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="6" y="6" width="500" height="500" rx="112"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <ellipse cx="256" cy="40" rx="330" ry="190" fill="url(#gloss)"/>
  </g>
  <rect x="7.5" y="7.5" width="497" height="497" rx="110.5" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>

  <g transform="translate(256 256) scale(1.27) translate(-256 -300)">
  <!-- Discord glyph -->
  <g filter="url(#shadow)">
    <g transform="translate(256 292) scale(2.05) translate(-63.57 -48.18)">
      <path fill="url(#glyph)" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.830,72.37,72.37,0,0,0,45.64,0,105.890,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.090,29.11,107.7,8.07ZM42.45,65.690C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.250,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
    </g>
  </g>

  <!-- headset -->
  <g filter="url(#shadow)">
    <!-- band -->
    <path d="M118 286 C118 150 394 150 394 286" fill="none" stroke="url(#dark)" stroke-width="30" stroke-linecap="round"/>
    <path d="M128 262 C140 168 372 168 384 262" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>
    <!-- ear cups -->
    <rect x="86" y="246" width="66" height="112" rx="30" fill="url(#dark)"/>
    <rect x="360" y="246" width="66" height="112" rx="30" fill="url(#dark)"/>
    <rect x="96" y="256" width="46" height="92" rx="22" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>
    <rect x="370" y="256" width="46" height="92" rx="22" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>
    <!-- mic boom -->
    <path d="M128 350 C138 410 190 424 236 418" fill="none" stroke="url(#dark)" stroke-width="13" stroke-linecap="round"/>
  </g>
  <!-- green accents with glow -->
  <g filter="url(#glow)">
    <rect x="410" y="270" width="9" height="64" rx="4.5" fill="url(#green)"/>
    <rect x="93" y="270" width="9" height="64" rx="4.5" fill="url(#green)"/>
    <rect x="228" y="402" width="46" height="30" rx="15" fill="url(#green)"/>
  </g>
  </g>
</svg>
